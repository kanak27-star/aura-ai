apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aura-backend
  template:
    metadata:
      labels:
        app: aura-backend
    spec:
      containers:
        - name: backend
          image: auraai-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: aura-secrets
          env:
            - name: DATABASE_URL
              value: sqlite:////data/voice_assistant.db
          volumeMounts:
            - name: aura-storage
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: aura-storage
          persistentVolumeClaim:
            claimName: aura-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: aura-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
